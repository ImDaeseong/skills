name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for real-looking secrets
        shell: powershell
        run: ./scripts/check_no_example_secrets.ps1
      - name: Regression test - secrets guard pattern set
        shell: powershell
        run: ./scripts/test_check_no_example_secrets.ps1
      - name: Validate workspace
        shell: powershell
        run: |
          $asOfDate = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, 'Korea Standard Time').Date
          ./scripts/validate_workspace.ps1 -AsOfDate $asOfDate
      - name: Check local Markdown links
        shell: powershell
        run: ./scripts/validate_links.ps1
      - name: Regression test - validators skip ignored dirs
        shell: powershell
        run: ./scripts/test_validators_ignore_scan.ps1
      - name: Check for OWASP/CWE-mapped security and network hotspots
        shell: powershell
        run: ./scripts/check_security_hotspots.ps1
      - name: Regression test - security hotspot guard pattern set
        shell: powershell
        run: ./scripts/test_check_security_hotspots.ps1
