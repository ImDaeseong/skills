# This skills workspace has NO Python test suite of its own — its checks are the PowerShell
# validators (scripts/validate_workspace.ps1, scripts/validate_links.ps1,
# scripts/test_validators_ignore_scan.ps1). This file exists only to fence the gitignored,
# third-party runtime clones out of any root-level `pytest` collection:
#
#   last30days/            (cloned by biz-council/curator)
#   marketingskills/       (cloned by distribution/curator)
#   book-to-skill/         (cloned by book-distiller)
#   claude-video/          (cloned by video-watcher)
#   claude-shorts/         (cloned by shorts-clipper)
#   video-use/             (cloned by footage-editor)
#   archify-src/           (cloned by diagram-forge)
#   ai-sales-team-claude/  (cloned by sales-desk)
#   charlie-cfo-skill/     (cloned by founder-finance)
#
# Those are POSIX-only upstream projects (where they carry their own tests at all) — their own
# CI runs `ubuntu-latest` exclusively — so running their suites under Windows-native pytest
# surfaces failures (cp949 decode, killpg, chmod 0600, SQLite handles, npx/PATH) that are NOT
# this repo's pass/fail criteria (see README.md's "제3자 의존성과 라이선스" section). This is a
# deterministic guard for a scope rule that was repeatedly treated as a gate when it lived only
# as prose. To run a clone's own suite, do it inside that clone on WSL/Linux, not from this root
# on Windows.
[pytest]
norecursedirs = last30days marketingskills book-to-skill claude-video claude-shorts video-use archify-src ai-sales-team-claude charlie-cfo-skill .git
addopts = --ignore=last30days --ignore=marketingskills --ignore=book-to-skill --ignore=claude-video --ignore=claude-shorts --ignore=video-use --ignore=archify-src --ignore=ai-sales-team-claude --ignore=charlie-cfo-skill
